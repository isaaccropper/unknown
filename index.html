  pass(P_DOWN, R_EIGHTH, function (u) { bind(0, R_HALF.t); gl.uniform1i(u.uT, 0); gl.uniform2f(u.uSize, R_EIGHTH.w, R_EIGHTH.h); gl.uniform2f(u.uPx, 1 / R_HALF.w, 1 / R_HALF.h); });
  blur(R_EIGHTH, R_ETMP, R_LARGE, 2.75);                      // the sampler's wide glow (22 px at full size)
}

function frame() {
  requestAnimationFrame(frame);
  var ms = nowMs(); if (ms - lastDraw < 30 && ms >= lastDraw) return; lastDraw = ms; drawn++;      // hold to about 30 frames a second
  var T = (ms - ANCHOR) / 1000;
  var tb = (ms - BOOT0) / 1000, boot = tb < BOOT_LEN, t = BOOT_LEN + 1;
  if (boot && tb >= 0) {
    t = bootClock(tb); window.__t = t;
    vid.style.opacity = t >= CLEAR ? 0 : 1;                  // the HUD leaves on the same frame as the lines; the boot's sound plays on to the end
    dimEl.style.opacity = (0.62 * ramp(t, HUD_IN, HUD_IN + 0.4) * (1 - ramp(t, SCRAMBLE - 0.4, SCRAMBLE - 0.05))).toFixed(3);
  } else if (!boot) endBoot();
  if (boot && (tb < 0 || t < CLEAR)) {                       // before the run, and while the boot still owns the screen: black
    if (!blanked) { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); blanked = true; }
    return;
  }
  blanked = false;
  var hr = ((T / 3600 + PT_OFFSET_H) % 24 + 24) % 24, dl = daylight(hr);
  var D = daylightIntegral(T), travel = 0.45 * T + 0.55 * D, churn = 30 * (0.05 * T + 0.09 * D), level = 0.42 + 0.36 * dl;
  var nLock = lockedCount(), span = NR * 2;
  for (var x = 0; x < NC; x++) {
    var hp = (colH0[x] + colSpd[x] * travel) % span;
    for (var y = 0; y < NR; y++) {
      var i = y * NC + x, j = i * 4, li = lockIdx[i];
      if (!boot && li >= 0 && li < nLock) { buf[j] = frz[i]; buf[j + 1] = 255; buf[j + 2] = 60; buf[j + 3] = 255; continue; }   // locked: frozen character, full white
      var m = 1, add = 0;
      if (boot) {                                             // hand-off: each cell wakes when the spread reaches it
        var a = t - revealAt[i];
        if (a < 0) { buf[j] = 0; buf[j + 1] = 0; buf[j + 2] = 0; buf[j + 3] = 255; continue; }
        m = a < 0.25 ? a / 0.25 : 1; add = isSeed[i] ? Math.exp(-a / 0.7) : 0.6 * Math.exp(-a / 0.22);
      }
      var d = hp - y; if (d < 0) d += span;
      var b = d < 1 ? 0.95 : (d < NR ? (40 + 190 * Math.exp(-d / (NR / 9))) / 255 : 0.12) * (0.6 + 0.4 * hf(i, Math.floor(cnPh[i] + T * cnRate[i]) ^ 0x51ED));
      buf[j] = hi(i, Math.floor(cellPh[i] + churn * cellRate[i])) % NRAND; var o = b * level * m + add; buf[j + 1] = (o > 1 ? 1 : o) * 255; buf[j + 2] = 0; buf[j + 3] = 255;
    }
  }
  bind(0, T_DATA); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, NC, NR, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  if (nLock !== lastLocked) { rebuildGlow(); lastLocked = nLock; }
  pass(P_MAIN, null, function (u) { bind(0, T_DATA); bind(1, T_ATLAS); bind(2, R_SMALL.t); bind(3, R_LARGE.t); gl.uniform1i(u.uData, 0); gl.uniform1i(u.uAtlas, 1); gl.uniform1i(u.uS, 2); gl.uniform1i(u.uL, 3); });
}

function start(img) {
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  P_LOCK = prog(FS_LOCK); P_DOWN = prog(FS_DOWN); P_BLUR = prog(FS_BLUR); P_MAIN = prog(FS_MAIN);
  var vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  T_DATA = tex(NC, NR, gl.NEAREST);
  T_ATLAS = tex(0, 0, gl.NEAREST); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  R_HALF = target(W / 2, H / 2); R_HTMP = target(W / 2, H / 2); R_SMALL = target(W / 2, H / 2);
  R_EIGHTH = target(W / 8, H / 8); R_ETMP = target(W / 8, H / 8); R_LARGE = target(W / 8, H / 8);
  requestAnimationFrame(frame);
}
if (gl) { var img = new Image(); img.onload = function () { start(img); }; img.src = DATA.atlas; }
</script>
